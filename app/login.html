<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-page">
    <form class="card" id="loginForm" novalidate>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to order your food</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="error-text" id="emailError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password">
          <button type="button" class="toggle-pass" id="togglePass">Show</button>
        </div>
        <div class="error-text" id="passwordError"></div>
      </div>

      <div class="options">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Log in</button>

      <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const togglePass = document.getElementById("togglePass");

    // Show / hide the password
    togglePass.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      togglePass.textContent = hidden ? "Hide" : "Show";
    });

    function showError(input, errorId, message) {
      document.getElementById(errorId).textContent = message;
      input.classList.toggle("invalid", message !== "");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      let ok = true;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email.value.trim())) {
        showError(email, "emailError", "Please enter a valid email address.");
        ok = false;
      } else {
        showError(email, "emailError", "");
      }

      if (password.value.length < 6) {
        showError(password, "passwordError", "Password must be at least 6 characters.");
        ok = false;
      } else {
        showError(password, "passwordError", "");
      }

      if (ok) {
        // TODO: send email + password to your server here to check them.
        // For now we just go to the menu page.
        window.location.href = "menu.html";
      }
    });
  </script>
</body>
</html>
